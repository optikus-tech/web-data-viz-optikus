  <link rel="icon" href="./assets/icon/favicon2.ico" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

  <div class="header">
    <div class="container">
      <h1 class="titulo">AquaTech</h1>
      <ul class="navbar">
        <li>
          <a href="index.html">Inicial</a>
        </li>
        <li>
          <a href="simulador.html">Simulador</a>
        </li>
        <li>|</li>

          <a href="login.html">Login</a>
        </li>
        <li class="agora">
          <a href="#">Cadastro</a>
        </li>
      </ul>

  </div>

  <div class="login">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="container">
      <div class="card ">
        
               <div class="formulario">
          
        <div class="campo">
          <span>Nome Completo:</span>
          <input class='ipt' id="nome_input" type="text" placeholder="Seu nome" />
        </div>
        <div class="campo">
          <span>CPF:</span>
          <input class='ipt' id="cpf_input" type="text" placeholder="111.222.333-44" />
        </div>

        <div class="campo">
          <span>Telefone:</span>
          <input class='ipt' id="telefone_input" type="text" placeholder="11 23456-7890" />
        </div>

        <div class="campo">
          <span>E-mail:</span>
          <input class='ipt' id="email_input" type="text" placeholder="seu@email.com" />
        </div>

        <div class="campo">
          <span>Senha:</span>
          <input class='ipt' id="senha_input" type="password" placeholder="Sua senha" />
        </div>

        <div class="campo">
          <span>Confirmação da Senha:</span>
          <input class='ipt' id="confirmacao_senha_input" type="password" placeholder="Confirme sua senha" />
        </div>

          <button class="botao" onclick="cadastrar()">Cadastrar</button>
           <a class='acesso' href="login.html" onclick="irLogin()">Já tem conta? Faça Login</a>

          <div id="div_aguardar" class="loading-div">
            <img src="./assets/circle-loading.gif" id="loading-gif" />
          </div>
        </div>
        <div class = "imagem_cadastro">
          <div class = "quadrado_cadastro"></div>
        </div>

        <div id="div_erros_login"></div>
      </div>
    </div>
  </div>
  </div>

  <div class="footer">
    <div class="container">
      <h4>Feito com amor por aluno &hearts; SPTech &copy; 2023</h4>
      <span class="version">v1.0.0</span>
    </div>
  </div>
</body>

</html>

<script>


  function cadastrar() {

    var nomeVar = nome_input.value;
    var cpfVar = cpf_input.value;
    var telefoneVar = telefone_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;


    if (
      nomeVar == "" ||
      cpfVar == "" ||
      telefoneVar == "" ||
      senhaVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "Mensagem de erro para todos os campos em branco";

      finalizarAguardar();
      return false;
    } else if (cpfVar.length > 11) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "Mensagem de erro para cpf com caracteres a mais";

      finalizarAguardar();
      return false;
    } else if (!(emailVar.includes('@') && (emailVar.includes('.')))) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "Mensagem de erro para email deve incluir @ e .";

      finalizarAguardar();
      return false;
    } else if (senhaVar.length < 8) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "Mensagem de erro para senha deve conter pelo menos 8 caracteres";

      finalizarAguardar();
      return false;
    } else if (confirmacaoSenhaVar != senhaVar) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "Mensagem de erro para senhas conflitantes";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    // Verificando se o código de ativação é de alguma empresa cadastrada
  fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        cpfServer: cpfVar,
        telefoneServer: telefoneVar,
        emailServer: emailVar,
        senhaServer: senhaVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }


  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
