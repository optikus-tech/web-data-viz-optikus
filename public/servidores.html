<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servidores | Optikus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/dashboard-admin.css">
    <link rel="shortcut icon" href="./img/svg/favicon.svg" type="image/x-icon">
    <script src="./js/admin-sidebar.js" defer></script>
    <script src="./js/servidores.js" defer></script>
</head>

<body>
    <aside class="sidebar" data-admin-sidebar></aside>

    <main class="dashboard-content users-page">
        <header class="users-page-header">
            <div>
                <h2>Servidores</h2>
                <p class="dash-breadcrumb">Gerencie os servidores e a infraestrutura do sistema CFTV</p>
            </div>
        </header>

        <div class="toolbar">
            <div class="toolbar-left">
                <div class="search-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="search" id="search-input" placeholder="Buscar servidor..."
                        aria-label="Buscar servidor">
                </div>
                <button class="btn-filter" type="button" id="btn-abrir-filtro">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                    </svg>
                    Filtrar
                </button>
            </div>

            <button class="user-create" type="button" id="btn-abrir-cadastro">
                <svg class="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Criar servidor
            </button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>SERVIDOR</th>
                        <th>RESPONSABILIDADE</th>
                        <th>UNIDADE / LOCAL</th>
                        <th>STATUS</th>
                        <th>AÇÕES</th>
                    </tr>
                </thead>
                <tbody id="tabela-servidores-body">
                    <tr><td colspan="5">Carregando servidores...</td></tr>
                </tbody>
            </table>
        </div>
        <p class="form-feedback" id="mensagem-lista-servidores" role="alert" hidden></p>
    </main>

    <div class="modal-overlay" id="modal-servidor" aria-hidden="true">
        <section class="modal-content create-user-modal-content" role="dialog" aria-modal="true"
            aria-labelledby="titulo-modal-servidor">
            <header class="modal-header">
                <h3 id="titulo-modal-servidor">Criar Novo Servidor</h3>
                <button class="btn-close" id="btn-fechar-servidor" type="button" aria-label="Fechar">&times;</button>
            </header>
            <form id="form-servidor">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="numero-serie">Número de Série <span aria-hidden="true">*</span></label>
                        <div class="serial-validation-row">
                            <input class="form-control" id="numero-serie" name="numero_serie" type="text"
                                maxlength="64" autocomplete="off" placeholder="Ex: OPTK-SRV-00421" required>
                            <button class="btn-secondary" id="btn-validar-serie" type="button">Validar</button>
                        </div>
                    </div>
                    <p class="form-feedback server-validation-message" id="mensagem-validacao-serie"
                        role="status" aria-live="polite" hidden></p>

                    <fieldset class="server-fields" id="campos-servidor" disabled>
                        <div class="form-group">
                            <label for="mac-address">MAC Address Vinculado</label>
                            <input class="form-control" id="mac-address" type="text" readonly
                                placeholder="Aguardando validação do número de série">
                        </div>
                        <div class="form-group">
                            <label for="responsabilidade">Responsabilidade no Sistema CFTV</label>
                            <select class="form-control" id="responsabilidade" name="responsabilidade" required>
                                <option value="">Selecione uma responsabilidade...</option>
                                <option value="Armazenamento">Armazenamento de Vídeo</option>
                                <option value="Processamento de IA">Processamento de IA</option>
                                <option value="NVR">Gravação NVR</option>
                                <option value="Gateway de Streaming">Gateway de Streaming</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="id-local">Unidade / Local</label>
                            <select class="form-control" id="id-local" name="id_local" required>
                                <option value="">Selecione o local de instalação...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="hostname">Hostname</label>
                            <input class="form-control" id="hostname" name="hostname" type="text" maxlength="100"
                                autocomplete="hostname" placeholder="Ex: srv-optikus-storage-01" required>
                        </div>
                        <div class="form-group">
                            <label for="ip">Endereço IP</label>
                            <input class="form-control" id="ip" name="ip" type="text" maxlength="45"
                                inputmode="decimal" placeholder="Ex: 192.168.1.150" required>
                        </div>
                        <div class="form-group">
                            <label for="sistema-operacional">Sistema Operacional</label>
                            <input class="form-control" id="sistema-operacional" name="sistema_operacional"
                                type="text" maxlength="80" placeholder="Ex: Ubuntu Server" required>
                        </div>
                        <div class="form-group">
                            <label for="versao-so">Versão do SO</label>
                            <input class="form-control" id="versao-so" name="versao_so" type="text" maxlength="50"
                                placeholder="Ex: 22.04 LTS" required>
                        </div>
                    </fieldset>
                    <p class="form-feedback" id="mensagem-cadastro-servidor" role="alert" hidden></p>
                </div>
                <footer class="modal-footer">
                    <button class="btn-secondary" id="btn-cancelar-servidor" type="button">Cancelar</button>
                    <button class="btn-primary" type="submit">Salvar Servidor</button>
                </footer>
            </form>
        </section>
    </div>

    <div class="modal-overlay" id="modal-filtro-servidor" aria-hidden="true">
        <section class="modal-content" role="dialog" aria-modal="true" aria-labelledby="titulo-filtro-servidor">
            <header class="modal-header">
                <h3 id="titulo-filtro-servidor">Filtrar servidores</h3>
                <button class="btn-close" id="btn-fechar-filtro" type="button" aria-label="Fechar">&times;</button>
            </header>
            <form id="form-filtro-servidor">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="filtro-responsabilidade">Responsabilidade</label>
                        <select class="form-control" id="filtro-responsabilidade" name="responsabilidade">
                            <option value="">Todas</option>
                            <option value="Armazenamento">Armazenamento de Vídeo</option>
                            <option value="Processamento de IA">Processamento de IA</option>
                            <option value="NVR">Gravação NVR</option>
                            <option value="Gateway de Streaming">Gateway de Streaming</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="filtro-status-servidor">Status</label>
                        <select class="form-control" id="filtro-status-servidor" name="status">
                            <option value="">Todos</option>
                            <option value="ONLINE">Online</option>
                            <option value="OFFLINE">Offline</option>
                            <option value="MANUTENCAO">Manutenção</option>
                        </select>
                    </div>
                </div>
                <footer class="modal-footer">
                    <button class="btn-secondary" id="btn-limpar-filtro" type="button">Limpar</button>
                    <button class="btn-primary" type="submit">Buscar</button>
                </footer>
            </form>
        </section>
    </div>

    <div class="modal-overlay" id="modal-detalhes-servidor" aria-hidden="true">
        <section class="modal-content" role="dialog" aria-modal="true" aria-labelledby="titulo-detalhes-servidor">
            <header class="modal-header">
                <h3 id="titulo-detalhes-servidor">Informações do servidor</h3>
                <button class="btn-close" id="btn-fechar-detalhes" type="button" aria-label="Fechar">&times;</button>
            </header>
            <div class="modal-body server-details" id="detalhes-servidor"></div>
            <footer class="modal-footer">
            </footer>
        </section>
    </div>

    <div class="modal-overlay" id="modal-confirmar-exclusao-servidor" aria-hidden="true">
        <section class="modal-content" role="dialog" aria-modal="true"
            aria-labelledby="titulo-confirmar-exclusao-servidor">
            <header class="modal-header">
                <h3 id="titulo-confirmar-exclusao-servidor">Excluir servidor</h3>
                <button class="btn-close" id="btn-fechar-confirmacao-exclusao-servidor" type="button"
                    aria-label="Fechar">&times;</button>
            </header>
            <div class="modal-body">
                <p id="texto-confirmar-exclusao-servidor">Tem certeza de que deseja excluir este servidor?</p>
                <p class="form-feedback" id="mensagem-exclusao-servidor" role="alert" hidden></p>
            </div>
            <footer class="modal-footer">
                <button class="btn-secondary" id="btn-cancelar-exclusao-servidor" type="button">Cancelar</button>
                <button class="btn-tertiary" id="btn-confirmar-exclusao-servidor" type="button">Deletar</button>
            </footer>
        </section>
    </div>
</body>

</html>
