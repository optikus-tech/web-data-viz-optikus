<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários | Optikus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/dashboard-admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="./js/admin-sidebar.js" defer></script>
</head>

<body>
    <aside class="sidebar" data-admin-sidebar></aside>


    <main class="dashboard-content users-page">
        <header class="users-page-header">
            <div>
                <h2>Usuários</h2>
                <p class="dash-breadcrumb">Gerencie os membros da equipe e suas permissões de acesso no workspace</p>
            </div>
        </header>

        <div class="toolbar">
            <div class="toolbar-left">
                <div class="search-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="search" id="search-input" placeholder="Buscar usuário..." aria-label="Buscar usuário">
                </div>
                <button class="btn-filter" type="button" id="btn-abrir-modal-filtrar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                    </svg>
                    Filtrar
                </button>
            </div>

            <button class="user-create" type="button" id="btn-abrir-modal">
                <svg class="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Criar usuário
            </button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>USUÁRIO</th>
                        <th>FUNÇÃO</th>
                        <th>STATUS</th>
                        <th>ÚLTIMO ACESSO</th>
                        <th>AÇÕES</th>
                    </tr>
                </thead>
                <tbody id="tabela-usuarios-body"></tbody>
            </table>
        </div>
    </main>

    <template id="modelo-linha-usuario">
        <tr>
            <td>
                <div class="user-info">
                    <div class="avatar">--</div>
                    <div class="user-details">
                        <span class="user-name">Nome do Usuário</span>
                        <span class="user-email">email@exemplo.com</span>
                    </div>
                </div>
            </td>
            <td class="user-funcao text-dark">Função</td>
            <td>
                <span class="status-container status badge-active">
                    <span class="dot"></span> <span class="status-text">Ativo</span>
                </span>
            </td>
            <td class="user-acesso text-muted">Acesso</td>
            <td>
                <button class="action-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="1"></circle>
                        <circle cx="12" cy="5" r="1"></circle>
                        <circle cx="12" cy="19" r="1"></circle>
                    </svg>
                </button>
            </td>
        </tr>
    </template>



    <div class="modal-overlay" id="modal-usuario" aria-hidden="true">
        <section class="modal-content" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-usuario">
            <header class="modal-header">
                <h3 id="titulo-modal-usuario">Criar Novo Usuário</h3>
                <button class="btn-close" id="btn-fechar-modal" type="button" aria-label="Fechar">&times;</button>
            </header>
            <form id="form-usuario">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" class="form-control"
                            placeholder="Ex: Fernanda Caramico" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" class="form-control"
                            placeholder="Ex: Fernanda@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" class="form-control" placeholder="Ex: 123.345.678-90"
                            required>
                    </div>
                    <div class="form-group">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" class="form-control"
                            placeholder="Ex: (11) 95187-9922">
                    </div>
                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <input type="text" id="senha" name="senha" class="form-control" placeholder="Ex: senha123@"
                            required>
                    </div>
                    <div class="form-group">
                        <label for="funcao">Função no Sistema</label>
                        <select id="funcao" name="funcao" class="form-control" required>
                            <option value="">Selecione uma função...</option>
                            <option value="Admin">Admin</option>
                            <option value="Editor">Gestor</option>
                            <option value="Visualizador">Analista</option>
                        </select>
                    </div>
                </div>
                <footer class="modal-footer">
                    <button type="button" class="btn-secondary" id="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar Usuário</button>
                </footer>
            </form>
        </section>
    </div>

    <div class="modal-overlay" id="modal-filtro" aria-hidden="true">
        <section class="modal-content" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-usuario">
            <header class="modal-header">
                <h3 id="titulo-modal-usuario">Filtrar</h3>
                <button class="btn-close" id="btn-fechar-modal-filtrar" type="button"
                    aria-label="Fechar">&times;</button>
            </header>
            <form id="form-filtrar">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="funcao">Função no Sistema</label>
                        <select id="funcao" name="funcao" class="form-control" required>
                            <option value="">Selecione uma função...</option>
                            <option value="Admin">Admin</option>
                            <option value="Editor">Gestor</option>
                            <option value="Visualizador">Analista</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="funcao">Status</label>
                        <select id="funcao" name="funcao" class="form-control" required>
                            <option value="">Selecione um Status...</option>
                            <option value="Ativo">Ativo</option>
                            <option value="Inativo">Inativo</option>
                            <option value="Pendente">Pendente</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <div class="form-group">
                            <label for="funcao">Último Acesso</label>
                            <select id="funcao" name="funcao" class="form-control" required>
                                <option value="">Selecione um Período</option>
                                <option value="Hoje">Hoje</option>
                                <option value="SeteDias">Últimos 7 dias</option>
                                <option value="TrintaDias">Últimos 30 dias</option>
                                <option value="MaisTrinta">Há mais de 30 dias</option>
                                <option value="Nunca">Nunca Acessou</option>
                            </select>
                        </div>
                    </div>
                    <footer class="modal-footer">
                        <button type="button" class="btn-secondary" id="btn-limpar-filtrar">Limpar</button>
                        <button type="submit" class="btn-primary">Buscar</button>
                    </footer>
            </form>
        </section>
    </div>



    <script>
        function listarFuncionarios() {
            var fk_empresa = sessionStorage.getItem("empresa");

            if (fk_empresa == null) {
                console.log("ID da empresa não encontrado no sessionStorage!");
                return;
            }

            fetch("/empresas/listarFuncionarios", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    fk_empresa: fk_empresa
                })
            })
                .then(function (resposta) {
                    if (!resposta.ok) {
                        throw new Error("Erro ao buscar funcionários!");
                    }
                    return resposta.json();
                })
                .then(function (usuarios) {
                    var tabela = document.getElementById("tabela-usuarios-body");
                    var modelo = document.getElementById("modelo-linha-usuario");

                    tabela.innerHTML = "";

                    usuarios.forEach(function (usuario) {
                        var linha = modelo.content.cloneNode(true);

                        linha.querySelector(".avatar").textContent =
                            usuario.nome.substring(0, 2).toUpperCase();

                        linha.querySelector(".user-name").textContent = usuario.nome;
                        linha.querySelector(".user-email").textContent = usuario.email;
                        linha.querySelector(".user-funcao").textContent = usuario.cargo;

                        var status = linha.querySelector(".status-container");
                        var textoStatus = linha.querySelector(".status-text");

                        textoStatus.textContent = usuario.stats;

                        if (usuario.stats == "ATIVO") {
                            status.classList.add("badge-active");
                        } else {
                            status.classList.remove("badge-active");
                        }

                        linha.querySelector(".user-acesso").textContent = "-";

                        tabela.appendChild(linha);
                    });
                })
                .catch(function (erro) {
                    console.log("Erro ao listar funcionários:", erro);
                });
        }

        function cadastrar() {

            var nomeVar = nome.value;
            var cpfVar = cpf.value;
            var telefoneVar = telefone.value;
            var emailVar = email.value;
            var senhaVar = senha.value;


            if (
                nomeVar == "" ||
                cpfVar == "" ||
                telefoneVar == "" ||
                senhaVar == "" ||
                emailVar == "" ||
                senhaVar == ""
            ) {
                cardErro.style.display = "block";
                mensagem_erro.innerHTML =
                    "Mensagem de erro para todos os campos em branco";

                finalizarAguardar();
                return false;
            } else if (cpfVar.length > 11) {
                cardErro.style.display = "block";
                mensagem_erro.innerHTML =
                    "Mensagem de erro para cpf com caracteres a mais";

                finalizarAguardar();
                return false;
            } else if (!(emailVar.includes('@') && (emailVar.includes('.')))) {
                cardErro.style.display = "block";
                mensagem_erro.innerHTML =
                    "Mensagem de erro para email deve incluir @ e .";

                finalizarAguardar();
                return false;
            } else if (senhaVar.length < 8) {
                cardErro.style.display = "block";
                mensagem_erro.innerHTML =
                    "Mensagem de erro para senha deve conter pelo menos 8 caracteres";

                finalizarAguardar();
                return false;
            }
            fetch("/empresas/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    nomeServer: nomeVar,
                    cpfServer: cpfVar,
                    telefoneServer: telefoneVar,
                    emailServer: emailVar,
                    senhaServer: senhaVar
                }),
            })
                .then(function (resposta) {
                    console.log("resposta: ", resposta);
                })
                .catch(function (resposta) {
                    console.log(`#ERRO: ${resposta}`);
                    finalizarAguardar();
                });

            return false;
        }

        document.addEventListener('DOMContentLoaded', () => {
            listarFuncionarios();

            const modalFiltro = document.getElementById('modal-filtro');
            const formFiltro = document.getElementById('form-filtrar');
            const openFiltro = document.getElementById('btn-abrir-modal-filtrar');
            const closeFiltro = document.getElementById('btn-fechar-modal-filtrar');
            const clearFiltro = document.getElementById('btn-limpar-filtrar');
            const funcao = document.getElementById('funcao');

            function openModalFiltro() {
                modalFiltro.classList.add('active');
                modalFiltro.setAttribute('aria-hidden', 'false');
                funcao.focus();
            }

            function closeModalFiltro() {
                modalFiltro.classList.remove('active');
                modalFiltro.setAttribute('aria-hidden', 'true');
                openFiltro.focus();
            }

            function limparFiltros() {
                formFiltro.reset();
                funcao.focus();
                buscarUsuarios({});
            }

            clearFiltro.addEventListener('click', limparFiltros);
            openFiltro.addEventListener('click', openModalFiltro);
            closeFiltro.addEventListener('click', closeModalFiltro);

            const cancelFiltro = document.getElementById('btn-cancelar-filtrar');

            if (cancelFiltro != null) {
                cancelFiltro.addEventListener('click', closeModalFiltro);
            }

            modalFiltro.addEventListener('click', (event) => {
                if (event.target === modalFiltro) {
                    closeModalFiltro();
                }
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && modalFiltro.classList.contains('active')) {
                    closeModalFiltro();
                }
            });

            formFiltro.addEventListener('submit', (event) => {
                event.preventDefault();

                const filtros = Object.fromEntries(new FormData(formFiltro));
                buscarUsuarios(filtros);
                closeModalFiltro();
            });

            const modalUsuario = document.getElementById('modal-usuario');
            const formUsuario = document.getElementById('form-usuario');
            const openUsuario = document.getElementById('btn-abrir-modal');
            const closeUsuario = document.getElementById('btn-fechar-modal');
            const cancelUsuario = document.getElementById('btn-cancelar');
            const nomeInput = document.getElementById('nome');

            function openModalUsuario() {
                modalUsuario.classList.add('active');
                modalUsuario.setAttribute('aria-hidden', 'false');
                nomeInput.focus();
            }

            function closeModalUsuario() {
                modalUsuario.classList.remove('active');
                modalUsuario.setAttribute('aria-hidden', 'true');
                formUsuario.reset();
                openUsuario.focus();
            }

            openUsuario.addEventListener('click', openModalUsuario);
            closeUsuario.addEventListener('click', closeModalUsuario);
            cancelUsuario.addEventListener('click', closeModalUsuario);

            modalUsuario.addEventListener('click', (event) => {
                if (event.target === modalUsuario) {
                    closeModalUsuario();
                }
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && modalUsuario.classList.contains('active')) {
                    closeModalUsuario();
                }
            });

            formUsuario.addEventListener('submit', (event) => {
                event.preventDefault();

                if (!formUsuario.reportValidity()) {
                    return;
                }

                cadastrar();
                listarFuncionarios();
            });
        });

    </script>
</body>

</html>
