services:
  bd:
    image: namikazex/optikus-bd:latest
    container_name: bd
    environment:
      MYSQL_ROOT_PASSWORD: optikus_senha
      MYSQL_DATABASE: optikus
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  site:
    image: namikazex/optikus-site:latest
    container_name: optikus-site
    env_file:
      - ../.env.dev
    ports:
      - "3333:3333"
    depends_on:
      bd:
        condition: service_healthy
    restart: unless-stopped